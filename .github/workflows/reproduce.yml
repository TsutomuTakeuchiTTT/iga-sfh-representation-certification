name: Reproduce benchmarks

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Reproduce all benchmarks
        run: python tools/reproduce_all.py

      - name: Validate repository metadata
        run: python tools/validate_repository.py

      - name: Upload machine-readable run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproduction-summary-python-${{ matrix.python-version }}
          path: reproduction_summary.json
          if-no-files-found: error
